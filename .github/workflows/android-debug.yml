name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "scenes/**"
      - "scripts/**"
      - ".github/workflows/android-debug.yml"

permissions:
  contents: read

jobs:
  android-debug:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "latest"
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: true

      - name: Install Godot 4.4.1 and export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -O "$HOME/godot/godot.zip"
          unzip -oq "$HOME/godot/godot.zip" -d "$HOME/godot"
          chmod +x "$HOME/godot/Godot_v4.4.1-stable_linux.x86_64"
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O "$HOME/godot/templates.tpz"
          unzip -oq "$HOME/godot/templates.tpz" -d "$RUNNER_TEMP/godot-templates"
          cp "$RUNNER_TEMP/godot-templates/templates/"* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          test -f "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"
          test -f "$HOME/.local/share/godot/export_templates/4.4.1.stable/version.txt"
          echo "GODOT_BIN=$HOME/godot/Godot_v4.4.1-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Configure Android export environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          _editor_settings_advanced_mode = true
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          test -x "$JAVA_HOME/bin/java"
          test -f "$HOME/.android/debug.keystore"
          test -d /usr/local/lib/android/sdk/platform-tools

      - name: Import and validate project
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path . --import
          "$GODOT_BIN" --headless --editor --path . --quit

      - name: Export Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build dist
          echo "=== Android export environment ==="
          cat "$HOME/.config/godot/editor_settings-4.4.tres"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed | tail -40
          echo "=== Godot verbose Android export ==="
          "$GODOT_BIN" --headless --verbose --path . --export-debug Android build/veltrix-warfare-debug.apk
          test -s build/veltrix-warfare-debug.apk
          test "$(stat -c%s build/veltrix-warfare-debug.apk)" -gt 1000000
          cp build/veltrix-warfare-debug.apk dist/veltrix-warfare-android-debug.apk
          sha256sum dist/veltrix-warfare-android-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-warfare-android-debug
          path: dist/veltrix-warfare-android-debug.apk
          if-no-files-found: error
          retention-days: 14
